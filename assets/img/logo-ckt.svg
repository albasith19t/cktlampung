<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="cktGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cktGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="fiberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Tech Icon Symbol (Hexagon + Fiber Optic Node) -->
  <g transform="translate(10, 8)">
    <!-- Hexagon Frame -->
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" 
             fill="rgba(2, 132, 199, 0.08)" 
             stroke="url(#cktGradPrimary)" 
             stroke-width="2.5" 
             stroke-linejoin="round"/>
             
    <!-- Inner Fiber Circuit lines -->
    <path d="M16 32 L32 20 L48 32 L40 46 L24 46 Z" 
          fill="none" 
          stroke="url(#cktGradAccent)" 
          stroke-width="2" 
          stroke-linejoin="round" 
          opacity="0.9"/>
          
    <!-- Core Center Fiber Pulse -->
    <circle cx="32" cy="32" r="6" fill="url(#cktGradPrimary)" filter="url(#glow)"/>
    <circle cx="32" cy="32" r="3" fill="#ffffff"/>
    
    <!-- Optical Nodes -->
    <circle cx="32" cy="20" r="2.5" fill="#38bdf8"/>
    <circle cx="48" cy="32" r="2.5" fill="#818cf8"/>
    <circle cx="16" cy="32" r="2.5" fill="#00d2ff"/>
    <circle cx="40" cy="46" r="2.5" fill="#38bdf8"/>
    <circle cx="24" cy="46" r="2.5" fill="#818cf8"/>
  </g>

  <!-- Typography: CKT -->
  <text x="82" y="44" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="-1px" 
        fill="#0f172a">
    CKT
  </text>
  
  <!-- Typography: LAMPUNG Badge -->
  <rect x="156" y="21" width="84" height="24" rx="6" fill="url(#cktGradPrimary)"/>
  <text x="198" y="38" 
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="11" 
        font-weight="800" 
        letter-spacing="1.5px" 
        fill="#ffffff" 
        text-anchor="middle">
    LAMPUNG
  </text>

  <!-- Subtitle: PT Cipta Karya Teknologi -->
  <text x="84" y="60" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="9.5" 
        font-weight="600" 
        letter-spacing="0.8px" 
        fill="#64748b">
    PT CIPTA KARYA TEKNOLOGI
  </text>
  
  <!-- Optical Signal Dots -->
  <circle cx="250" cy="57" r="2" fill="#10b981"/>
  <text x="256" y="60" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#10b981">ONLINE</text>
</svg>
